services:
  product-db:
    image: postgres:16-alpine
    container_name: shopzone-product-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: product-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${postgres:?Set postgres in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product-service"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: shopzone-product-service
    restart: unless-stopped
    env_file:
      - ./product-service/.env
    environment:
      PORT: 5002
      DB_HOST: product-db
      DB_PORT: 5432
      DB_NAME: product-service
      DB_USER: postgres
    ports:
      - "5002:5002"
    depends_on:
      product-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5002/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10

  product-mfe:
    build:
      context: ./product-mfe
      dockerfile: Dockerfile
    container_name: shopzone-product-mfe
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      product-service:
        condition: service_healthy

volumes:
  product_db_data: