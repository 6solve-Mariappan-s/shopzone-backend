services:
  product-db:
    image: postgres:18-alpine
    container_name: shopzone-product-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopzone_products
      POSTGRES_USER: ${PRODUCT_DB_USER:?Missing PRODUCT_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?Missing PRODUCT_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - product_db_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  product-api:
    build:
      context: .
      dockerfile: modules/products/backend/Dockerfile
    container_name: shopzone-product-api
    restart: unless-stopped
    env_file:
      - ./modules/products/backend/.env
    environment:
      NODE_ENV: production
      PORT: 5002
      DATABASE_URL: postgres://${PRODUCT_DB_USER}:${PRODUCT_DB_PASSWORD}@product-db:5432/shopzone_products
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://host.docker.internal:5013}
    ports:
      - "5002:5002"
    depends_on:
      product-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10

  product-mfe:
    build:
      context: .
      dockerfile: modules/products/frontend/Dockerfile
    container_name: shopzone-product-mfe
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      product-api:
        condition: service_healthy

volumes:
  product_db_data:
